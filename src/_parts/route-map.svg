<title id="rm-title">練馬駅からの道順の図</title>
<desc id="rm-desc">練馬駅の南側から千川通りを渡り、マクドナルドの角を南へ。ファミリーマートと七輪焼肉 牛繁のあいだを進み、斜めの通りを渡ってすぐ右の青いビルの3階。</desc>
